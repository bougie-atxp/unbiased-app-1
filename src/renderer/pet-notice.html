<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:;" />
    <title>Pal update</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      * { box-sizing: border-box; }
      #root { width: 100%; height: 100%; }
      .notice-stack { display: flex; flex-direction: column; gap: 8px; width: 100%; height: 100%; overflow-y: auto; scrollbar-width: none; }
      .notice-stack::-webkit-scrollbar { display: none; }
      .notice { display: grid; grid-template-columns: minmax(0, 1fr) 28px; align-items: start; gap: 8px; flex: 0 0 76px; width: 100%; height: 76px; padding: 12px 12px 12px 16px; border: 0.25px solid rgba(255,255,255,.32); border-radius: 32px; background: rgba(62,64,68,.34); box-shadow: 0 8px 28px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.12); -webkit-backdrop-filter: blur(36px) saturate(160%); backdrop-filter: blur(36px) saturate(160%); color: #fff; font: 14px/21px system-ui, sans-serif; }
      .notice-open { display: flex; flex-direction: column; justify-content: center; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer; }
      .notice-open:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 4px; }
      .title, .response { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .title { display: block; max-width: 100%; font-weight: 650; }
      .response { display: block; max-width: 100%; margin-top: 4px; color: #e3e3e5; font-size: 13px; line-height: 19px; }
      .dismiss { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.12); color: #f6f6f7; font: 21px/1 system-ui, sans-serif; cursor: pointer; }
      .dismiss:hover, .dismiss:focus-visible { background: rgba(255,255,255,.23); }
      .dismiss:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/pet-notice.ts"></script>
  </body>
</html>
