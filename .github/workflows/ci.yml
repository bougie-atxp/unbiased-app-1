name: CI

on:
  pull_request:
    branches:
      - main
      - "naveen/**" # Validate stacked PRs before their parent reaches main.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests-gate:
    name: Tests gate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read pinned browser repository
        id: browser-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: unbiased-browser
          permission-contents: read

      - name: Prepare pinned browser client
        run: node build/prepare-browser.cjs --runtime-only
        env:
          GITHUB_TOKEN: ${{ steps.browser-token.outputs.token }}

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  browser-bundle:
    name: Browser bundle
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Read pinned browser repository
        id: browser-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: unbiased-browser
          permission-contents: read

      - name: Fetch and build pinned browser component
        run: node build/prepare-browser.cjs
        env:
          GITHUB_TOKEN: ${{ steps.browser-token.outputs.token }}

      - name: Install runtime build dependencies
        run: npm ci

      - name: Build desktop and standalone runtime
        run: npm run build

      - name: Smoke test browser control
        run: node build/smoke-browser.cjs

      - name: Smoke test standalone browser runtime
        run: npm run smoke:browser-runtime

      - name: Smoke test desktop browser mirror
        run: |
          node node_modules/electron/install.js
          npm run smoke:browser-mirror
