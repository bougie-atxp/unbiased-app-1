name: CI

on:
  pull_request:
    branches:
      - main
      - "naveen/**" # Validate stacked PRs before their parent reaches main.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests-gate:
    name: Tests gate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  browser-bundle:
    name: Browser bundle
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch verified browser binaries
        run: node build/prepare-browser.cjs

      - name: Install runtime build dependencies
        run: npm ci

      - name: Build desktop and standalone runtime
        run: npm run build

      - name: Smoke test browser control
        run: node build/smoke-browser.cjs

      - name: Smoke test standalone browser runtime
        run: npm run smoke:browser-runtime

      - name: Smoke test desktop browser mirror
        run: |
          node node_modules/electron/install.js
          npm run smoke:browser-mirror
