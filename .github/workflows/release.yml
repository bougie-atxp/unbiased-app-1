name: Release

# Tag-driven releases, published CROSS-REPO to the public releases repo
# (circuitandchisel/unbiased-app-releases). Push a v* tag here to build the DMG,
# checksums it, publishes the release over there, and syncs install.sh so the
# public copy never drifts from the source of truth in scripts/.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# REQUIRES two ORG secrets, from the release GitHub App:
#   RELEASE_APP_ID          — the App's numeric id.
#   RELEASE_APP_PRIVATE_KEY — the App's private key (PEM).
#
# This job reaches three repositories — it checks the engine out of one and
# publishes to another — and the default github.token is scoped to this one,
# so it needs a credential of its own. That used to be two fine-grained PATs,
# which belong to a PERSON: invisible from the org side, unrevokable by
# offboarding, and expiring on their own 90-day clock. The App is owned by the
# org, and what actually flows through CI is an installation token that lasts
# about an hour.
#
# Runs on macOS because a .dmg can only be built (and codesigned) on macOS.
# macos-15 is an Apple Silicon runner, which matches our arm64-only target —
# the bundled Pareto engine has no x64 slice, so this cannot cross-compile.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASES_REPO: circuitandchisel/unbiased-app-releases

jobs:
  release:
    runs-on: macos-15
    env:
      # Developer ID signing + notarization switch on when the secrets exist.
      # Without them the build is ad-hoc signed exactly as before.
      SIGNING_ENABLED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - name: checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: unbiased-app

      # One token for every cross-repo step below. `repositories:` is not
      # optional here: by default the minted token is scoped to THIS repo
      # alone, and this job also reads unbiased-app-engine and writes
      # unbiased-app-releases. The App must also be installed on unbiased-browser.
      - name: mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            unbiased-app
            unbiased-app-engine
            unbiased-app-releases
            unbiased-browser

      # The engine must sit BESIDE the app: package.json's extraResources
      # copies from ../unbiased-app-engine/dist/bundle.
      - name: checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: circuitandchisel/unbiased-app-engine
          # Merged engine PRs #14 and #15; includes command-backed sign-in
          # and pins app-server 0.1.5 for signed-in compaction.
          ref: c1d89df94cda866e47f7b6442b690857f3914e98
          token: ${{ steps.app-token.outputs.token }}
          path: unbiased-app-engine

      # The accessibility bridge must sit BESIDE the app too: extraResources
      # copies from ../unbiased-ax/dist. Without it `npm run dist` fails at
      # the copy, which would only show up on a tag push.
      # No token: this checkout uses only public repository data.
      - name: checkout accessibility bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: circuitandchisel/unbiased-ax
          path: unbiased-ax

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: unbiased-app-engine/go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The full gate runs again here: a tag can be pushed on any commit, so
      # the release build must not assume CI already blessed it.
      - name: engine tests
        working-directory: unbiased-app-engine
        run: make test

      # fetch-engine.sh pulls the pinned forked app-server through the
      # engine.lock checksum gate (public release — no secret).
      - name: build engine bundle
        working-directory: unbiased-app-engine
        run: make bundle

      # Same gate the engine gets, for the same reason: a tag can be pushed on
      # any commit. The bridge's tests need no framework — CommandLineTools
      # ships neither XCTest nor Swift Testing, so they are an executable.
      - name: bridge tests
        working-directory: unbiased-ax
        run: make test

      # Produces dist/unbiased-ax (ad-hoc signed, stable identifier) and
      # dist/manifest.json, which is what extraResources copies.
      - name: build bridge bundle
        working-directory: unbiased-ax
        run: make bundle

      # electron-builder names the DMG from package.json's version, NOT the
      # tag, so a tag pushed without bumping package.json would publish a
      # release whose asset contradicts its own title. Fail loudly instead.
      - name: verify tag matches package.json version
        working-directory: unbiased-app
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          echo "tag=$GITHUB_REF_NAME package.json=$pkg"
          [ "$GITHUB_REF_NAME" = "v$pkg" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg — bump package.json (or retag)"
            exit 1
          }

      - name: install app deps
        working-directory: unbiased-app
        run: npm ci

      - name: prepare pinned browser client
        working-directory: unbiased-app
        run: node build/prepare-browser.cjs --runtime-only
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: typecheck
        working-directory: unbiased-app
        run: npm run typecheck

      # Developer ID path: import the certificate into a throwaway keychain and
      # stage the App Store Connect API key for notarytool. Secrets needed on
      # this repo: MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_TEAM_ID,
      # ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64.
      - name: import Developer ID certificate
        if: env.SIGNING_ENABLED == 'true'
        id: cert
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(uuidgen)"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::the certificate has no Developer ID Application identity"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      # electron-builder's afterPack hook ad-hoc signs the bundle and FAILS
      # the build if the signature doesn't verify, so a broken app can't ship.
      - name: build DMG
        if: env.SIGNING_ENABLED != 'true'
        working-directory: unbiased-app
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Same build, then electron-builder re-signs with the Developer ID identity
      # under the hardened runtime, notarizes the app with the API key and
      # staples the ticket before the DMG is built (mac.notarize). The ad-hoc
      # afterPack hook still runs first; the real signature replaces it.
      - name: build, sign and notarize DMG
        if: env.SIGNING_ENABLED == 'true'
        working-directory: unbiased-app
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APPLE_API_KEY: ${{ runner.temp }}/asc-key.p8
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run dist -- \
            -c.mac.identity="${{ steps.cert.outputs.identity }}" \
            -c.mac.hardenedRuntime=true \
            -c.mac.gatekeeperAssess=false \
            -c.mac.entitlements=build/entitlements.mac.plist \
            -c.mac.entitlementsInherit=build/entitlements.mac.plist \
            -c.mac.notarize=true

      # The bridge is spawned at runtime from Contents/Resources/ax; if the
      # copy silently did not happen, the app ships without desktop control
      # and nothing else fails. Check it explicitly.
      - name: verify the bridge shipped
        working-directory: unbiased-app
        run: |
          bin="release/mac-arm64/Unbiased.app/Contents/Resources/ax/unbiased-ax"
          [ -x "$bin" ] || { echo "::error::$bin missing from the packaged app"; exit 1; }
          echo '{"id":1,"method":"hello"}' | "$bin" | grep -q '"protocolVersion":1' || {
            echo "::error::the packaged bridge did not answer hello"; exit 1; }
          echo "bridge shipped and answers: $bin"

      - name: verify the preview Pareto engine shipped
        working-directory: unbiased-app
        run: |
          bin="release/mac-arm64/Unbiased.app/Contents/Resources/engine/unbiased-app-engine"
          [ -x "$bin" ] || { echo "::error::$bin missing from the packaged app"; exit 1; }
          strings "$bin" | grep -q 'model = "pareto-26.10-preview"' || {
            echo "::error::packaged engine is not configured for pareto-26.10-preview"; exit 1; }
          strings "$bin" | grep -q 'model_context_window = 1048576' || {
            echo "::error::packaged engine does not declare the 1M context window"; exit 1; }
          echo "preview Pareto engine shipped: $bin"

      - name: checksums
        working-directory: unbiased-app/release
        run: shasum -a 256 *.dmg > SHA256SUMS

      - name: verify the packaged app
        working-directory: unbiased-app
        run: |
          app="release/mac-arm64/Unbiased.app"
          # The engine really is inside the bundle (the whole point of shipping
          # one file), and the signature seals it.
          test -x "$app/Contents/Resources/engine/unbiased-app-engine"
          test -x "$app/Contents/Resources/engine/pareto-app-server"
          expected_version="$(sed -n 's/^version = //p' ../unbiased-app-engine/engine.lock)"
          test -n "$expected_version"
          test "$("$app/Contents/Resources/engine/pareto-app-server" --version)" = "codex-app-server $expected_version"
          test -x "$app/Contents/Resources/browser/agent-browser"
          test -x "$app/Contents/Resources/browser/browser-supervisor"
          test -x "$app/Contents/Resources/browser/Unbiased Browser.app/Contents/MacOS/Google Chrome for Testing"
          codesign --verify --deep --strict "$app"
          if [ "$SIGNING_ENABLED" = "true" ]; then
            # Gatekeeper must accept the notarized, stapled app outright.
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "$app"
          fi
          ls -lh release/*.dmg

      - name: smoke test packaged browser
        working-directory: unbiased-app
        run: node build/smoke-browser.cjs release/mac-arm64/Unbiased.app/Contents/Resources/browser

      - name: smoke test packaged standalone runtime without Electron
        working-directory: unbiased-app
        run: node build/smoke-browser-runtime.cjs release/mac-arm64/Unbiased.app/Contents/Resources/browser release/mac-arm64/Unbiased.app/Contents/Resources/browser-runtime/main.js

      - name: publish release to the public repo
        working-directory: unbiased-app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Notes come from CHANGELOG.md — the same file the app bundles and
          # parses, so what ships in the build and what the releases repo
          # serves cannot disagree. The section for THIS tag only: from its
          # `## <version> — <date>` heading to the next one.
          VERSION="${GITHUB_REF_NAME#v}"
          # index/substr, not a regex: the dots in a version are literal.
          awk -v head="## $VERSION — " '
            index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION — <date>' section. Add one before tagging."
            exit 1
          fi
          # Everything below the rule is for someone browsing GitHub; the app
          # strips it, so keep it last.
          {
            cat /tmp/notes.md
            echo
            echo "---"
            echo
            echo "Apple Silicon Mac, macOS 12+."
            echo
            echo "Install:"
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/$RELEASES_REPO/main/install.sh | bash"
            echo '```'
            if [ "$SIGNING_ENABLED" = "true" ]; then
              echo "Or download the .dmg below and drag Unbiased to Applications."
            else
              echo "Or download the .dmg below and drag Unbiased to Applications. The first time, macOS says it cannot verify the app: click Done, open System Settings > Privacy & Security, scroll to Security and click Open Anyway, then open it again (right-click > Open on macOS 14 and earlier). The app is ad-hoc signed, not notarized."
            fi
            echo
            echo "On first launch, click Sign in with your browser. There is no key to paste."
          } > /tmp/body.md

          gh release create "$GITHUB_REF_NAME" \
            --repo "$RELEASES_REPO" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/body.md \
            release/*.dmg \
            release/SHA256SUMS

      # scripts/install.sh is the source of truth and already
      # points its REPO at the public releases repo. Push a verbatim copy
      # every release so the public copy can never drift.
      - name: sync install.sh to the public repo
        working-directory: unbiased-app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          current_sha=$(gh api "repos/$RELEASES_REPO/contents/install.sh" --jq .sha 2>/dev/null || true)
          if [ -n "$current_sha" ]; then
            existing=$(gh api "repos/$RELEASES_REPO/contents/install.sh" --jq .content | base64 -d)
            if [ "$existing" = "$(cat scripts/install.sh)" ]; then
              echo "install.sh already up to date"; exit 0
            fi
          fi
          gh api -X PUT "repos/$RELEASES_REPO/contents/install.sh" \
            -f message="Sync install.sh from source ($GITHUB_REF_NAME)" \
            -f content="$(base64 < scripts/install.sh | tr -d '\n')" \
            ${current_sha:+-f sha="$current_sha"}
